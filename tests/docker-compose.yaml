services:
  test_ais_v1_all:
    build:
      context: .
      dockerfile: ./dockerfile.v1
    volumes:
      - ../:/repo
    runtime: nvidia # ensure that Nvidia Container Toolkit is installed
    ipc: host
    working_dir: /repo
    command: >
      bash -c "bash tests/run_tests.sh od"
  
