model:
  class_name: "Patchcore"
  params:
    backbone: "wide_resnet50_2"
    layers: ["layer2", "layer3"]
    pre_trained: true
    image_size: [448, 448]
    tile_size: [224, 224]
    sride: [112, 112]
    coreset_sampling_ratio: 0.1
    num_neighbors: 15
    # "float16" halves memory-bank size and speeds up training; requires available GPU
    # "float32" is the default and works on CPU/GPU
    precision: "float16"

data:
  name: "dataset"
  root: "/app/data/toothbrush"
  normal_dir: "train"
  extensions: [".png"]
  train_batch_size: 32
  eval_batch_size: 32
  num_workers: 8
  test_split_mode: "synthetic"
  test_split_ratio: 0.2
  val_split_mode: "same_as_test"
  val_split_ratio: 0.5

engine:
  max_epochs: 1
  # float16 precision requires CUDA; change to "auto" when using float32
  accelerator: "auto"
  devices: 1
  default_root_dir: "/app/out/"
