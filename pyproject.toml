[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "lmi_ai_solutions"
version = "1.6.0"
description = "LMI AI Solutions mono-repo package"
requires-python = ">=3.8"
dependencies = []

[project.scripts]
# From lmi_utils
labels-preprocess = "label_utils.apply_ops:main"
labels-convert-yolo = "label_utils.json_to_yolo:main"
labels-convert-lst = "label_utils.lst_to_json:main"
gadget-surface = "gadget_utils.gadget_surface_utils:main"
gadget-image = "gadget_utils.gadget_image:main"

[tool.setuptools.packages.find]
where = [
    "anomaly_detectors",
    "classifiers",
    "lmi_utils",
    "object_detectors",
]
exclude = [
    "*submodules*",
    "*legacy*",
    "*deprecated*",
    "*tf_objdet*",
]

[tool.ruff]
target-version = "py38"
line-length = 140
exclude = [
    "submodules",
    "assets",
    "__pycache__",
    "build",
    "dist",
    "legacy",
    "deprecated",
]

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
fixable = ["ALL"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
log_cli = true
log_level = "INFO"
testpaths = ["tests"]
norecursedirs = ["submodules", "assets", "__pycache__"]
