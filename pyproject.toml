[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "lmi_ai_solutions"
version = "1.6.0"
description = "LMI AI Solutions mono-repo package"
requires-python = ">=3.8"
dependencies = []

[dependency-groups]
# Single source of truth for test deps (replaces tests/requirements-*.txt).
# `test` holds the shared pins; `ci` and `gpu` layer on the CPU vs CUDA stacks.
test = [
    "scikit-learn==1.7.2",
    "tensorboard==2.21.0",
    "numpy<2.0",
    "ultralytics==8.4.170",
    "onnx==1.23.1",
    "onnxslim==0.1.97",
    "pytest==9.1.1",
    "rfdetr==1.11.1",
    "albumentations>=2.0.8,<3.0.0",
    "transformers==5.18.0",
    "pycocotools==2.0.11",
    "shapely==2.1.2",
    "tabulate>=0.9.0",
    "setuptools<82",  # detectron2 model_zoo imports pkg_resources, removed in setuptools 82
]
# CPU / CI env (GitHub runners): CPU torch + CPU onnxruntime. torch is also a
# transitive dep of rfdetr/ultralytics, hence the ci/gpu conflict below.
# ci/gpu pick the torch build (index); the ad group installed with them pins its version.
ci = [
    { include-group = "test" },
    "onnxruntime==1.21.0",
    "onnx-graphsurgeon>=0.5.0",  # detectron2 convert test
    "torch",
    "torchvision",
]
# Resolving [core] replaces `anomalib install --option core`, which pip-installed numpy>=2 behind the lock's back.
ad-v1 = [
    "anomalib[core]==1.1.1",
    "jsonargparse==4.27.7",
    "torch==2.5.1",  # torch>=2.6 raises a weights_only error loading anomalib 1.x models
    "torchvision==0.20.1",
]
ad-v2 = [
    "anomalib==2.6.0",
    "onnx==1.23.1",  # train.py fixes exported ONNX output shapes
    "torch==2.6.0",  # anomalib 2.x requires torch>=2.6
    "torchvision==0.21.0",
]
# GPU / TensorRT env (local + compose, x86_64 only): cu124 torch, onnxruntime-gpu, and the
# TensorRT engine-build stack. tensorrt is pinned to the nvcr:25.04 image's
# version (10.9.0.34) so local engines match CI. pytest-html backs run_tests.sh.
gpu = [
    { include-group = "test" },
    "onnxruntime-gpu==1.21.0; platform_machine == 'x86_64'",  # no aarch64 wheels
    "torch",
    "torchvision",
    "tensorrt==10.9.0.34",
    "onnx-graphsurgeon>=0.5.0",
    "pytest-html>=4.1.1",
]

[tool.uv]
# Linux CPython test images (3.10 CI, 3.12 nvcr): uv 0.12.18+ needs wheels for every env; numpy<2.0 breaks onnx on 3.13+.
environments = [
    """python_full_version >= '3.10' and python_full_version < '3.13' and sys_platform == 'linux' \
    and platform_machine == 'x86_64' and platform_python_implementation == 'CPython'""",
    """python_full_version >= '3.10' and python_full_version < '3.13' and sys_platform == 'linux' \
    and platform_machine == 'aarch64' and platform_python_implementation == 'CPython'""",
]
# ci/gpu are incompatible torch builds (+cpu vs +cu124); ad-v1/ad-v2 are incompatible anomalib majors.
conflicts = [
    [{ group = "ci" }, { group = "gpu" }],
    [{ group = "ad-v1" }, { group = "ad-v2" }],
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

# cu124 has no aarch64 torch 2.6.0, so gpu on aarch64 (unused) takes every torch version from PyPI.
[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", group = "ci" },
    { index = "pytorch-cu124", group = "gpu", marker = "platform_machine == 'x86_64'" },
]
torchvision = [
    { index = "pytorch-cpu", group = "ci" },
    { index = "pytorch-cu124", group = "gpu", marker = "platform_machine == 'x86_64'" },
]

[project.scripts]
# From lmi_utils
labels-preprocess = "lmi_utils.label_utils.apply_ops:main"
labels-convert-yolo = "lmi_utils.label_utils.json_to_yolo:main"
labels-convert-lst = "lmi_utils.label_utils.lst_to_json:main"
gadget-surface = "lmi_utils.gadget_utils.gadget_surface_utils:main"
gadget-image = "lmi_utils.gadget_utils.gadget_image:main"

[tool.setuptools.packages.find]
where = ["."]
include = [
    "anomaly_detectors*",
    "classifiers*",
    "lmi_utils*",
    "object_detectors*",
    "lmi_common*",
]
exclude = [
    "*legacy*",
    "*deprecated*",
    "*tf_objdet*",
]

[tool.ruff]
target-version = "py38"
line-length = 140
exclude = [
    "submodules",
    "assets",
    "__pycache__",
    "build",
    "dist",
    "legacy",
    "deprecated",
]

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
fixable = ["ALL"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
log_cli = true
log_level = "INFO"
testpaths = ["tests"]
norecursedirs = ["submodules", "assets", "__pycache__"]
addopts = "-rs"
markers = ["arch_sensitive: compares two inference paths, which can drift apart on another CPU; the only OD tests CI runs on arm64"]
