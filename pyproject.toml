[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "lmi_ai_solutions"
version = "1.6.0.1"
description = "LMI AI Solutions mono-repo package"
requires-python = ">=3.8"
dependencies = []

[project.scripts]
# From lmi_utils
labels-preprocess = "lmi_utils.label_utils.apply_ops:main"
labels-convert-yolo = "lmi_utils.label_utils.json_to_yolo:main"
labels-convert-lst = "lmi_utils.label_utils.lst_to_json:main"
gadget-surface = "lmi_utils.gadget_utils.gadget_surface_utils:main"
gadget-image = "lmi_utils.gadget_utils.gadget_image:main"

[tool.setuptools]
include-package-data = true
packages = [
    "lmi_utils",
    "lmi_utils.system_utils",
    "lmi_utils.dataset_utils",
    "lmi_utils.eval_utils",
    "lmi_utils.label_utils",
    "lmi_utils.label_utils.shapes",
    "lmi_utils.system_utils",
    "lmi_utils.dataset_utils.ops",
    "lmi_utils.preprocess_utils",
    "lmi_utils.dataset_utils",
    "lmi_utils.pcl_utils",
    "lmi_utils.postprocess_utils",
    "lmi_utils.image_utils",
    "lmi_utils.pipeline_base",
    "lmi_utils.gadget_utils",
    "pipeline_base",
    "pipeline_base.core",
    "pipeline_base.core.schemas",
    "gadget_utils",
    "object_detectors",
    "object_detectors.od_core",
    "object_detectors.rf_detr_lmi",
    "object_detectors.ultralytics_lmi.yolo",
    "object_detectors.yolov5_lmi.trt",
    "object_detectors.yolov5_lmi",
    "object_detectors.yolov8_lmi",
    "object_detectors.detectron2_lmi",
    "object_detectors.submodules",
    "object_detectors.submodules.yolov5",
    "classifiers",
    "classifiers.cls_core",
    "classifiers.yolov8_cls",
    "anomaly_detectors",
    "anomaly_detectors.ad_core",
    "anomaly_detectors.anomalib_lmi"
]
[tool.setuptools.package-dir]
"lmi_utils" = "lmi_utils"
"pipeline_base" = "lmi_utils/pipeline_base"
"object_detectors" = "object_detectors"
"classifiers" = "classifiers"
"anomaly_detectors" = "anomaly_detectors"
"anomalib_lmi" = "anomaly_detectors/anomalib_lmi"
"gadget_utils" = "lmi_utils/gadget_utils"

#[tool.setuptools.packages.find]
#where = ["."]
#include = [
#    "anomaly_detectors*",
#    "classifiers*",
#    "lmi_utils*",
#    "object_detectors*",
#]
#exclude = [
#    "*submodules*",
#    "*legacy*",
#    "*deprecated*",
#    "*tf_objdet*",
#]

[tool.ruff]
target-version = "py38"
line-length = 140
exclude = [
    "submodules",
    "assets",
    "__pycache__",
    "build",
    "dist",
    "legacy",
    "deprecated",
]

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
fixable = ["ALL"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
log_cli = true
log_level = "INFO"
testpaths = ["tests"]
norecursedirs = ["submodules", "assets", "__pycache__"]