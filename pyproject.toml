#    "object_detectors*",
#]
#exclude = [
#    "*submodules*",
#    "*legacy*",
#    "*deprecated*",
#    "*tf_objdet*",
#]

[tool.ruff]
target-version = "py38"
line-length = 140
exclude = [
    "submodules",
    "assets",
    "__pycache__",
    "build",
    "dist",
    "legacy",
    "deprecated",
]

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
fixable = ["ALL"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
log_cli = true
log_level = "INFO"
testpaths = ["tests"]
norecursedirs = ["submodules", "assets", "__pycache__"]