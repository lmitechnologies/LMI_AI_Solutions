[tool.ruff]
line-length = 140
exclude = [
    "submodules",
    "assets",
    "__pycache__",
    "build",
    "dist",
]

[tool.ruff.lint]
# Enable specific rule sets (e.g., Pyflakes, Isort, Flake8-bugbear)
select = ["E", "F", "I", "B"]
fixable = ["ALL"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
log_cli = true
log_level = "INFO"
testpaths = ["tests"]
norecursedirs = ["submodules", "assets", "__pycache__"]
