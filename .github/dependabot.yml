version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      time: "04:00"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"

  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
      time: "04:00"
    # Mirrors [tool.uv] exclude-newer; without it uv refuses to lock what Dependabot proposes.
    cooldown:
      default-days: 30
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    cooldown:
      default-days: 7
    ignore:
      # GPU-only packages — GitHub runners are CPU, so CI can't validate these.
      - dependency-name: "torch"
      - dependency-name: "torchvision"
      # Pinned to the same version as onnxruntime-gpu; bumping one alone splits CI from GPU.
      - dependency-name: "onnxruntime"
      - dependency-name: "onnxruntime-gpu"
      - dependency-name: "tensorrt*"
      - dependency-name: "onnx-graphsurgeon"
      - dependency-name: "nvidia-*"