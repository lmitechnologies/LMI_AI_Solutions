version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      time: "04:00"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"

  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
      time: "04:00"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    cooldown:
      default-days: 7
    ignore:
      # GPU-only packages — GitHub runners are CPU, so CI can't validate these.
      - dependency-name: "torch"
      - dependency-name: "torchvision"
      # Pinned to the same version as onnxruntime-gpu; bumping one alone splits CI from GPU.
      - dependency-name: "onnxruntime"
      - dependency-name: "onnxruntime-gpu"
      - dependency-name: "tensorrt*"
      - dependency-name: "onnx-graphsurgeon"
      - dependency-name: "nvidia-*"
      # Pinned for anomalib 1.x; anomalib 2.x needs <4.47, so bumps can't resolve.
      - dependency-name: "jsonargparse"
      # ad-v1's anomalib 1.x pin. Dependabot names it by its extra, so ad-v2's plain `anomalib` still gets bumps.
      - dependency-name: "anomalib[core]"
      # Build-system floor stays low for JetPack 5 (Python 3.8); setuptools 76+ needs Python 3.9+.
      - dependency-name: "setuptools"
