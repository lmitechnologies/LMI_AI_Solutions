version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      time: "04:00"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"

  - package-ecosystem: "pip"
    directory: "/tests"
    schedule:
      interval: "weekly"
      time: "04:00"
    open-pull-requests-limit: 5
    groups:
      torch:
        patterns:
          - "torch"
          - "torchvision"
    labels:
      - "dependencies"