name: CI

on:
  push:
    branches: [ "ais" ]
  pull_request:
    branches: [ "ais" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      skip_tests: ${{ steps.check.outputs.skip_tests }}
      req_changed: ${{ steps.check.outputs.req_changed }}
    steps:
      - uses: actions/checkout@v6
        with:
          lfs: false
          submodules: false
          fetch-depth: 0
          
      - name: Check if run CI
        id: check
        run: |
          python .github/workflows/scripts/check_changes.py
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}

  build-images:
    needs: check-changes
    if: needs.check-changes.outputs.req_changed == 'true'
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10']
        anomalib-version: ['v1.1.1', 'v2.2.0']
        runner-config:
          - runner: ubuntu-latest
            platform: linux/amd64
            arch: amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
            arch: arm64
    runs-on: ${{ matrix.runner-config.runner }}
    env:
      IMAGE_NAME: ghcr.io/lmitechnologies/ais-test-env
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Compute image tag
        id: tag
        run: |
          BASE="py${{ matrix.python-version }}-${{ matrix.runner-config.arch }}-${{ matrix.anomalib-version }}"
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            echo "tag=${BASE}-pr-${{ github.event.pull_request.number }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${BASE}" >> $GITHUB_OUTPUT
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./tests/dockerfile.ci
          platforms: ${{ matrix.runner-config.platform }}
          build-args: |
            PYTHON_VERSION=${{ matrix.python-version }}
            ANOMALIB_VERSION=${{ matrix.anomalib-version }}
          push: true
          tags: ${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.tag }}

  cleanup-untagged-images:
    needs: build-images
    if: needs.build-images.result == 'success' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - name: Delete untagged images older than retention period
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          PACKAGE_NAME: "ais-test-env"
          RETENTION_DAYS: 7
        run: bash .github/workflows/scripts/cleanup_untagged_images.sh

  run-test:
    needs: [check-changes, build-images]
    if: |
      always() &&
      needs.check-changes.outputs.skip_tests != 'true' &&
      (needs.build-images.result == 'success' || needs.build-images.result == 'skipped')
    
    strategy:
      fail-fast: false
      matrix:
        runner-config:
          - runner: ubuntu-latest
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
        python-version: ['3.10']
        test_scenario: 
          - name: "no_ad"
            version: "v1.1.1"
          - name: "ad_v1"
            version: "v1.1.1"
          - name: "ad_v2"
            version: "v2.2.0" 
    
    timeout-minutes: 30
    runs-on: ${{ matrix.runner-config.runner }}
    
    # Use PR-tagged image when requirements changed in a PR, otherwise use stable image
    container:
      image: ghcr.io/lmitechnologies/ais-test-env:py${{ matrix.python-version }}-${{ matrix.runner-config.arch }}-${{ matrix.test_scenario.version }}${{ needs.check-changes.outputs.req_changed == 'true' && github.event_name == 'pull_request' && format('-pr-{0}', github.event.pull_request.number) || '' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          lfs: false
          submodules: 'true'

      - name: Mark workspace as safe
        run: git config --global --add safe.directory $(pwd)

      - name: Create Git LFS file list
        run: git lfs ls-files -l |cut -d' ' -f1 |sort >.git/lfs-hashes.txt

      - name: Restore Git LFS object cache
        uses: actions/cache@v5
        with:
          path: .git/lfs
          key: lfsdata-v1-${{ hashFiles('.git/lfs-hashes.txt') }}
          restore-keys: |
            lfsdata-v1-
            lfsdata

      - name: Fetch any needed Git LFS objects and prune extraneous ones
        run: git lfs fetch --prune

      - name: Check out Git LFS content
        run: git lfs checkout

      - name: Install LMI AI Solutions packages
        run: |
          pip install -e .
          
      - name: Run tests
        shell: bash
        run: |
          MODE="${{ matrix.test_scenario.name }}"
          echo "Running Test Scenario: $MODE"
          
          # Check if the mode string starts with 'ad_'
          if [[ "$MODE" == ad_v1 ]]; then
            echo "Running Anomaly Detection Tests..."
            pytest tests/anomaly_detectors/anomalib_lmi/test_anomaly_model_v1.py
          elif [[ "$MODE" == ad_v2 ]]; then
            echo "Running Anomaly Detection Tests with Anomalib v2.2.0..."
            pytest tests/anomaly_detectors/anomalib_lmi/test_anomaly_model_v2.py
          else
            echo "Running Standard (No-AD) Tests..."
            OTHER_TEST_SUITE=(lmi_utils object_detectors classifiers)
            for suite in "${OTHER_TEST_SUITE[@]}"; do
              pytest tests/${suite}
            done
          fi

  ci-success:
    runs-on: ubuntu-latest
    needs: run-test
    if: always()
    steps:
      - name: Check run-test matrix status
        run: |
          result="${{ needs.run-test.result }}"
          
          echo "Overall 'run-test' result: $result"
          
          if [[ $result == "success" || $result == "skipped" ]]; then
            echo "CI check passed."
            exit 0
          else
            echo "CI check failed. The matrix status was: $result"
            exit 1
          fi