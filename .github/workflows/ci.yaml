name: CI

on:
  push:
    branches: [ "ais" ]
  pull_request:
    branches: [ "ais" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      skip_tests: ${{ steps.check.outputs.skip_tests }}
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
          submodules: false
          fetch-depth: 0
          
      - name: Check if only docs changed
        id: check
        run: |
          # Determine the correct base for comparison
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            # For PRs, compare against the base branch
            git fetch origin ${{ github.base_ref }}
            base="origin/${{ github.base_ref }}"
          else
            # For push events, compare against the previous commit
            base="${{ github.event.before }}"
            # If before is empty or all zeros (initial commit), use HEAD~1
            if [ -z "$base" ] || [ "$base" == "0000000000000000000000000000000000000000" ]; then
              base="HEAD~1"
            fi
          fi
          
          echo "Comparing against: $base"
          files=$(git diff --name-only $base HEAD)
          
          echo "Changed files:"
          echo "$files"
          
          # Filter out docs/config files
          code_files=$(echo "$files" | grep -vE '(^docs/|\.md$|\.ya?ml$|^\.git)' || true)
          
          if [ -z "$code_files" ]; then
            echo "skip_tests=true" >> $GITHUB_OUTPUT
          else
            echo "skip_tests=false" >> $GITHUB_OUTPUT
          fi

  run-test:
    needs: check-changes
    if: ${{ needs.check-changes.outputs.skip_tests != 'true' && github.head_ref != 'update-pre-commit-hooks' }}
    
    strategy:
      matrix:
        runner-config:
          - runner: ubuntu-latest
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
        python-version: ['3.10']
        test_suite: ["no-AD", "AD"]
    
    timeout-minutes: 30
    runs-on: ${{ matrix.runner-config.runner }}
    
    container:
      image: ghcr.io/lmitechnologies/ais-test-env:py${{ matrix.python-version }}-${{ matrix.runner-config.arch }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          lfs: false
          submodules: 'true'

      - name: Mark workspace as safe
        run: git config --global --add safe.directory $(pwd)

      - name: Create Git LFS file list
        run: git lfs ls-files -l |cut -d' ' -f1 |sort >.git/lfs-hashes.txt

      - name: Restore Git LFS object cache
        uses: actions/cache@v4
        with:
          path: .git/lfs
          key: lfsdata-v1-${{ hashFiles('.git/lfs-hashes.txt') }}
          restore-keys: |
            lfsdata-v1-
            lfsdata

      - name: Fetch any needed Git LFS objects and prune extraneous ones
        run: git lfs fetch --prune

      - name: Check out Git LFS content
        run: git lfs checkout

      - name: Install LMI AI Solutions packages
        run: |
          pip install -e object_detectors -e anomaly_detectors -e lmi_utils -e classifiers
          
      - name: Run tests
        shell: bash
        run: |
          OTHER_TEST_SUITE=(lmi_utils object_detectors classifiers)
          
          if [ "${{ matrix.test_suite }}" == "AD" ]; then
            pytest --ignore=tests/anomaly_detectors/anomalib_lmi/test_anomaly_model.py tests/anomaly_detectors
          else
            for suite in "${OTHER_TEST_SUITE[@]}"; do
              pytest tests/${suite}
            done
          fi
