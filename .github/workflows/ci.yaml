name: CI

on:
  push:
    branches: [ "ais" ]
  pull_request:
    branches: [ "ais" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check-changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      skip_tests: ${{ steps.check.outputs.skip_tests }}
      req_changed: ${{ steps.check.outputs.req_changed }}
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: false
          submodules: false
          fetch-depth: 0

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.11"
          enable-cache: false

      - name: Check if run CI
        id: check
        run: |
          python .github/workflows/scripts/check_changes.py
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}

  build-images:
    needs: check-changes
    if: needs.check-changes.outputs.req_changed == 'true'
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10']
        ad-group: ['ad-v1', 'ad-v2']
        runner-config:
          - runner: ubuntu-latest
            platform: linux/amd64
            arch: amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
            arch: arm64
    runs-on: ${{ matrix.runner-config.runner }}
    env:
      IMAGE_NAME: ghcr.io/lmitechnologies/ais-test-env
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Compute image tag
        id: tag
        run: |
          BASE="py${{ matrix.python-version }}-${{ matrix.runner-config.arch }}-${{ matrix.ad-group }}"
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            echo "tag=${BASE}-pr-${{ github.event.pull_request.number }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${BASE}" >> $GITHUB_OUTPUT
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./tests/dockerfile.ci
          platforms: ${{ matrix.runner-config.platform }}
          build-args: |
            PYTHON_VERSION=${{ matrix.python-version }}
            AD_GROUP=${{ matrix.ad-group }}
          push: true
          tags: ${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.tag }}

  run-test:
    needs: [check-changes, build-images]
    if: |
      always() &&
      needs.check-changes.result == 'success' &&
      needs.check-changes.outputs.skip_tests != 'true' &&
      (needs.build-images.result == 'success' || needs.build-images.result == 'skipped')
    
    strategy:
      fail-fast: false
      matrix:
        runner-config:
          - runner: ubuntu-latest
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
        python-version: ['3.10']
        test_scenario:
          - name: "utils_cls"
            group: "ad-v1"
          - name: "od"
            group: "ad-v1"
          - name: "ad_v1"
            group: "ad-v1"
          - name: "ad_v2"
            group: "ad-v2"
    
    timeout-minutes: 30
    runs-on: ${{ matrix.runner-config.runner }}
    
    # Use PR-tagged image when requirements changed in a PR, otherwise use stable image
    container:
      image: ghcr.io/lmitechnologies/ais-test-env:py${{ matrix.python-version }}-${{ matrix.runner-config.arch }}-${{ matrix.test_scenario.group }}${{ needs.check-changes.outputs.req_changed == 'true' && github.event_name == 'pull_request' && format('-pr-{0}', github.event.pull_request.number) || '' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          lfs: false
          submodules: 'true'

      - name: Mark workspace as safe
        run: git config --global --add safe.directory $(pwd)

      - name: Create Git LFS file list
        run: git lfs ls-files -l |cut -d' ' -f1 |sort >.git/lfs-hashes.txt

      - name: Restore Git LFS object cache
        uses: actions/cache@v6
        with:
          path: .git/lfs
          key: lfsdata-v1-${{ hashFiles('.git/lfs-hashes.txt') }}
          restore-keys: |
            lfsdata-v1-
            lfsdata

      - name: Fetch any needed Git LFS objects and prune extraneous ones
        run: git lfs fetch --prune

      - name: Check out Git LFS content
        run: git lfs checkout

      - name: Install LMI AI Solutions packages
        run: |
          pip install -e .
          
      - name: Run tests
        shell: bash
        run: |
          MODE="${{ matrix.test_scenario.name }}"
          echo "Running Test Scenario: $MODE"
          
          if [[ "$MODE" == ad_v1 ]]; then
            pytest tests/anomaly_detectors \
              --ignore=tests/anomaly_detectors/anomalib_lmi/test_v0.py \
              --ignore=tests/anomaly_detectors/anomalib_lmi/test_v2.py
          elif [[ "$MODE" == ad_v2 ]]; then
            pytest tests/anomaly_detectors/anomalib_lmi/test_v2.py
          elif [[ "$MODE" == od ]]; then
            OD_MARKS=()
            # arm64 inference is slow; the other OD tests give the same result on any CPU and run on amd64
            if [[ "${{ matrix.runner-config.arch }}" == arm64 ]]; then
              OD_MARKS=(-m arch_sensitive)
            fi
            pytest tests/object_detectors "${OD_MARKS[@]}"
          elif [[ "$MODE" == utils_cls ]]; then
            pytest tests/lmi_common tests/lmi_utils tests/classifiers
          else
            echo "Unknown test scenario: $MODE"
            exit 1
          fi

  ci-success:
    runs-on: ubuntu-latest
    needs: [check-changes, build-images, run-test]
    if: always()
    steps:
      - name: Check job results
        run: |
          changes="${{ needs.check-changes.result }}"
          build="${{ needs.build-images.result }}"
          tests="${{ needs.run-test.result }}"

          echo "check-changes: $changes | build-images: $build | run-test: $tests"

          # run-test is also skipped when an earlier job fails, so skipped only passes if those succeeded
          if [[ $changes == "success" && ($build == "success" || $build == "skipped") && ($tests == "success" || $tests == "skipped") ]]; then
            echo "CI check passed."
            exit 0
          else
            echo "CI check failed."
            exit 1
          fi