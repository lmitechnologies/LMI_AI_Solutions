name: Release

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (no tags, releases, or commits are published)"
        type: boolean
        default: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Show run mode
        run: echo "Dry run is ${{ inputs.dry_run }}"

      - name: Generate app token
        uses: actions/create-github-app-token@v3
        id: app-token
        with:
          app-id: ${{ secrets.AIS_CI_APP_ID }}
          private-key: ${{ secrets.AIS_CI_APP_KEY }}

      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Install dependencies
        run: |
          npm install -g semantic-release @semantic-release/github @semantic-release/changelog @semantic-release/git @semantic-release/exec
          pip install tomlkit

      - name: Run semantic-release
        run: npx semantic-release ${{ inputs.dry_run && '--dry-run' || '' }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GIT_CREDENTIALS: "x-access-token:${{ steps.app-token.outputs.token }}"