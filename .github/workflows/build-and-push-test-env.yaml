name: Build and Publish Test Docker Image

on:
  workflow_dispatch:

jobs:
  build-and-push-test-env:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        python-version: ['3.12']

    env:
      IMAGE_NAME: ghcr.io/lmitechnologies/ais-test-env

    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=py${{ matrix.python-version }}
            type=raw,value=latest,enable=${{ matrix.python-version == '3.12' }}

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .       # Use the root of the repo for the build context
          file: ./tests/dockerfile.ci
          build-args: |
            PYTHON_VERSION=${{ matrix.python-version }}
          push: true       # Push the image after building
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Make package public
        run: |
          gh package set-visibility ${{ env.IMAGE_NAME }} --public
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}