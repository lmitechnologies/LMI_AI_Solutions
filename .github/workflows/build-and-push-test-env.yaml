name: Build and Publish Test Docker Image

on:
  workflow_dispatch:
  pull_request:
    branches: [ "ais" ]

jobs:
  build-and-push-test-env:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        nv-version: ['25.04'] # nvidia/tensorrt versions to build

    env:
      IMAGE_NAME: ghcr.io/lmitechnologies/ais-test-env

    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ matrix.nv-version }}
            type=raw,value=latest,enable=${{ matrix.nv-version == '25.04' }}

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .       # Use the root of the repo for the build context
          file: ./tests/dockerfile.ci
          build-args: |
            NV_VERSION=${{ matrix.nv-version }}
          push: true       # Push the image after building
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
