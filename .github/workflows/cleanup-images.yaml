name: Cleanup Old Images
on:
  pull_request:
    types: [closed]
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run mode (no deletions)'
        type: boolean
        default: true
      retention_days:
        description: 'Delete untagged images older than N days'
        type: number
        default: 7

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  cleanup-pr-images:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          lfs: false
          submodules: false

      - name: Delete PR-tagged images
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          PACKAGE_NAME: "ais-test-env"
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: bash .github/workflows/scripts/cleanup_pr_images.sh

  cleanup:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          lfs: false
          submodules: false

      - name: Delete untagged images older than retention period
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          PACKAGE_NAME: "ais-test-env"
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
          RETENTION_DAYS: ${{ inputs.retention_days || 7 }}
        run: bash .github/workflows/scripts/cleanup_untagged_images.sh