name: Build, Test, and Push Docker Image

# 1. This workflow is triggered on pushes to the 'ais' branch
on:
  push:
    branches: [ "ais" ]
  pull_request:
    branches: [ "ais" ]
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# 2. This section is CRITICAL.
# It grants the workflow's GITHUB_TOKEN permissions to write packages.
permissions:
  contents: read      # To check out the repository's code
  packages: write     # To push Docker images to ghcr.io

jobs:
  build-test-and-push:
    # 3. Use the latest Ubuntu runner
    runs-on: ubuntu-latest

    steps:
      # 4. Check out the repository's code
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: 'true'
          lfs: 'true'

      # 5. Log in to the GitHub Container Registry (ghcr.io)
      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          # Use the GITHUB_TOKEN for authentication
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }} # <-- Corrected typo

      # 6. Extract metadata (tags and labels) for the Docker image
      # This action automatically creates useful tags:
      # - "latest" for the default branch
      # - The commit SHA
      # - Git tag (if you push a tag)
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          # This creates a base image name of: ghcr.io/YOUR_USERNAME/YOUR_REPO
          # The action handles lowercasing the repository name for you.
          images: ghcr.io/${{ github.repository }}

      # 7. Build the Docker image and load it locally
      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./tests/dockerfile.ci
          load: true   # <-- CHANGED: Load image into local daemon
          push: false  # <-- CHANGED: Do not push yet
          # Use the tags and labels generated by the 'meta' step
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Caches build layers to speed up future builds
          cache-from: type=registry,ref=ghcr.io/${{ github.repository }}:buildcache
          cache-to: type=registry,ref=ghcr.io/${{ github.repository }}:buildcache,mode=max

      # 8. NEW STEP: Run tests on the built image
      # This assumes 'pytest' is on the PATH in your Docker image's CMD or ENTRYPOINT.
      # If your tests fail, 'docker run' will exit with an error,
      # which will fail this step and stop the entire workflow.
      - name: Run tests inside the container
        run: |
          echo "Running test lmi_utils..."
          docker run --rm ghcr.io/${{ github.repository }}:latest pytest /home/gadget/LMI_AI_Solutions/tests/lmi_utils

          echo "Running test object_detectors..."
          docker run --rm ghcr.io/${{ github.repository }}:latest pytest LMI_AI_Solutions/tests/object_detectors

          echo "Running test classifers..."
          docker run --rm ghcr.io/${{ github.repository }}:latest pytest /home/gadget/LMI_AI_Solutions/tests/classifiers

          echo "Running test anomaly_detectors (excluding anomalib v0 test)..."
          docker run --rm ghcr.io/${{ github.repository }}:latest pytest \
            --ignore=/home/gadget/LMI_AI_Solutions/tests/anomaly_detectors/anomalib_lmi/test_anomaly_model.py \
            /home/gadget/LMI_AI_Solutions/tests/anomaly_detectors

      # 9. NEW STEP: Push the image *after* tests pass
      # This step will only run if the 'Run tests' step succeeds.
      # It reads all tags from the 'meta' step and pushes them one by one.
      - name: Push Docker image to ghcr.io
        run: |
          echo "Tests passed. Pushing all tags to registry..."
          echo "${{ steps.meta.outputs.tags }}" | while read tag; do
            docker push "$tag"
          done
