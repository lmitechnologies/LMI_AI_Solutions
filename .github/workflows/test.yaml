name: Test

on:
  push:
    branches: [ "ais" ]
  pull_request:
    branches: [ "ais" ]
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:


jobs:
  build-and-test:
    defaults:
      run:
        working-directory: ${{ github.workspace }}

    strategy:
      matrix:
          os: [ubuntu-latest]
          python: ["3.12"]
          test_suite: ["lmi_utils", "object_detectors", "classifiers", "anomaly_detectors"]
    runs-on: ${{ matrix.os }}
    container:
      image: ghcr.io/lmitechnologies/ais-test-env:py${{ matrix.python }}
      options: --user root
    name: Test ${{ matrix.test_suite }} with Python ${{ matrix.python }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: 'true'

      - name: DEBUG - Check user and .git permissions
        run: |
          echo "--- DEBUG INFO ---"
          echo "Current user: $(whoami)"
          echo "Workspace path: $(pwd)"
          echo ""
          echo "--- Listing workspace (ls -la) ---"
          ls -la
          echo ""
          echo "--- Listing .git dir (ls -la .git) ---"
          ls -la .git
          echo "--- END DEBUG ---"

      - name: Create Git LFS file list
        run: git lfs ls-files -l |cut -d' ' -f1 |sort >.git/lfs-hashes.txt

      - name: Restore Git LFS object cache
        uses: actions/cache@v4
        with:
          path: .git/lfs
          key: ${{ runner.os }}-lfsdata-v1-${{ hashFiles('.git/lfs-hashes.txt') }}
          restore-keys: |
            ${{ runner.os }}-lfsdata-v1-
            ${{ runner.os }}-lfsdata

      - name: Fetch any needed Git LFS objects and prune extraneous ones
        run: git lfs fetch --prune

      - name: Check out Git LFS content
        run: git lfs checkout

      - name: Install LMI AI Solutions packages
        run: |
          pip install -e object_detectors
          pip install -e anomaly_detectors
          pip install -e lmi_utils
          pip install -e classifiers
          
      - name: Run tests
        run: |
          TEST_PATH="tests/${{ matrix.test_suite }}"
          EXTRA_PYTEST_ARGS=""
          
          if [ "${{ matrix.test_suite }}" == "anomaly_detectors" ]; then
            EXTRA_PYTEST_ARGS="--ignore=tests/anomaly_detectors/anomalib_lmi/test_anomaly_model.py"
          fi
          
          pytest $EXTRA_PYTEST_ARGS $TEST_PATH
